name: Madoc TS Deploy Preview

on:
  workflow_run:
    workflows: ['Madoc TS Docker']
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-preview:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.pr.outputs.deploy }}
      number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Check pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          test -n "$PR_NUMBER"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json labels,isCrossRepository,state \
            --jq '"deploy=" + (((.state == "OPEN") and (.isCrossRepository | not) and any(.labels[]; .name == "deploy-preview")) | tostring)' \
            >> "$GITHUB_OUTPUT"

  deploy-preview:
    needs: check-preview
    if: ${{ needs.check-preview.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    environment: deploy-preview
    concurrency:
      group: madoc-ts-deploy-preview
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_PREVIEW_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_PREVIEW_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/madoc.pem"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"

      - name: Deploy preview
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_PREVIEW_HOST }}
          PR_NUMBER: ${{ needs.check-preview.outputs.number }}
        run: |
          ssh -i "$RUNNER_TEMP/madoc.pem" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            "$DEPLOY_HOST" \
            "cd /etc/docker/compose/madoc/ && sudo env MADOC_TS_TAG=pr-$PR_NUMBER docker-compose --env-file /etc/madoc-environment pull && sudo env MADOC_TS_TAG=pr-$PR_NUMBER docker-compose --env-file /etc/madoc-environment up -d"
