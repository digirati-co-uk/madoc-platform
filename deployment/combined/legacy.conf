# Preserve methods and bodies on old API URLs while migration callers are retired.
location ~ ^/api/crowdsourcing/models/(?<model_id>[^/]+)$ {
  return 308 /api/madoc/crowdsourcing/model/$model_id$is_args$args;
}
location ~ ^/api/crowdsourcing(?<suffix>/.*)?$ {
  return 308 /api/madoc/crowdsourcing$suffix$is_args$args;
}
location ~ ^/api/search(?<suffix>/.*)?$ {
  return 308 /api/madoc/search$suffix$is_args$args;
}
location ~ ^/api/okra/convert/(?<format>hocr|mets-alto|plaintext|google-vision)$ {
  return 308 /api/madoc/ocr/convert/$format$is_args$args;
}
