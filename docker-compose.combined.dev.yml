services:
  madoc:
    image: madoc-combined-dev:local
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      PM2_SERVER_INSTANCES: "1"
      PM2_QUEUE_INSTANCES: "1"
    ports:
      - "${PORTS_GATEWAY_HTTPS:-443}:443"
      - "3088:3088"
      - "3089:3089"
    volumes:
      - ./services/madoc-ts/src:/workspace/services/madoc-ts/src
      - ./services/madoc-ts/dist:/workspace/services/madoc-ts/dist
      - ./services/madoc-ts/vite:/workspace/services/madoc-ts/vite
      - ./services/tasks-api/src:/workspace/services/tasks-api/src
      - ./services/storage-api/src:/workspace/services/storage-api/src
      - ./services/config-service/src:/workspace/services/config-service/src
      - ./var/certs:/certs:ro
